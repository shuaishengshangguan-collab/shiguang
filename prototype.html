<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拾光 ShiGuang · 约拍撮合 App 高保真原型</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%2315161A'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='%23C08B4E' stroke-width='5'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#15161A; --ink2:#3B3D45; --paper:#FBFAF7; --card:#FFFFFF;
  --gold:#C08B4E; --gold-d:#7A4F1F; --gold-t:#F6EEDF;
  --line:#EAE5DC; --muted:#8C8578; --ok:#2E7D5B; --ok-t:#E7F2EC; --bad:#B4432F;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  background:#0E0F12; color:var(--ink); min-height:100vh;
  display:flex; align-items:center; justify-content:center; padding:36px 20px;
}
.stage{display:flex; align-items:center; gap:56px}

/* 左侧信息栏 */
.rail{width:250px; color:#9A938A}
.rail .brand{font-size:24px; font-weight:700; color:#F2EEE6; letter-spacing:.06em; margin-bottom:6px}
.rail .brand span{font-size:12px; font-weight:400; color:#6F6860; letter-spacing:.18em; margin-left:6px}
.rail .tag{font-size:12px; color:#7A736B; line-height:1.7; margin-bottom:26px}
.roleSwitch{display:flex; background:#1B1C21; border:1px solid #2C2D34; border-radius:12px; padding:4px; margin-bottom:22px}
.roleSwitch button{flex:1; border:0; background:none; color:#8B847B; font-size:12.5px; padding:10px 0; border-radius:9px; cursor:pointer; transition:.18s; font-family:inherit}
.roleSwitch button.on{background:var(--gold); color:#1A1206; font-weight:600}
.rail .hint{font-size:11.5px; line-height:1.9; color:#6F6860}
.rail .hint b{color:#A89F94; font-weight:600}

/* 手机框架 */
.phone{
  width:390px; height:844px; background:var(--paper); border-radius:48px;
  border:11px solid #0A0A0D; position:relative; overflow:hidden;
  box-shadow:0 40px 90px rgba(0,0,0,.55), 0 0 0 1px #232429;
}
.statusbar{
  position:absolute; top:0; left:0; right:0; height:50px; z-index:40;
  display:flex; align-items:flex-end; justify-content:space-between;
  padding:0 28px 7px; font-size:13px; font-weight:600; color:var(--ink);
  pointer-events:none; transition:color .2s;
}
.statusbar.light{color:#fff}
.statusbar .sb-r{display:flex; align-items:center; gap:5px; font-size:11px}
.bars{display:flex; align-items:flex-end; gap:2px}
.bars i{display:block; width:3px; background:currentColor; border-radius:1px}
.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:6px}
.bars i:nth-child(3){height:8px}.bars i:nth-child(4){height:10px}
.batt{width:22px;height:11px;border:1.4px solid currentColor;border-radius:3px;position:relative;opacity:.9}
.batt::after{content:"";position:absolute;right:-3.5px;top:3px;width:2px;height:5px;background:currentColor;border-radius:0 1px 1px 0}
.batt i{position:absolute;inset:1.6px;width:72%;background:currentColor;border-radius:1px;display:block}
.notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:108px;height:25px;background:#0A0A0D;border-radius:20px;z-index:45}

.screen{position:absolute; inset:0; overflow:hidden}
.view{position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; background:var(--paper); display:none; padding-bottom:100px}
.view.active{display:block}
.view::-webkit-scrollbar{width:0}

/* 底部导航 */
.tabbar{
  position:absolute; left:0; right:0; bottom:0; z-index:35; height:78px;
  background:rgba(255,255,255,.94); backdrop-filter:blur(16px);
  border-top:1px solid var(--line); display:flex; padding-bottom:16px;
}
.tab{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  border:0; background:none; cursor:pointer; color:var(--muted); font-size:10px; font-family:inherit; transition:.15s}
.tab.on{color:var(--ink); font-weight:600}
.tab.on svg{stroke:var(--gold-d)}

/* 通用 */
.appbar{
  position:sticky; top:0; z-index:20; background:rgba(251,250,247,.95); backdrop-filter:blur(12px);
  padding:56px 18px 12px; display:flex; align-items:center; gap:12px; border-bottom:1px solid transparent;
}
.appbar.solid{border-bottom-color:var(--line)}
.appbar .t{font-size:17px; font-weight:700; letter-spacing:.02em}
.appbar .back{width:34px;height:34px;border-radius:11px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.appbar .right{margin-left:auto;font-size:13px;color:var(--gold-d);font-weight:600}

h2.sec{font-size:15px;font-weight:700;padding:0 18px;margin:22px 0 12px;display:flex;align-items:center;justify-content:space-between}
h2.sec span{font-size:11.5px;font-weight:400;color:var(--muted)}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:0 18px 12px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:3px 9px;border-radius:20px;background:var(--gold-t);color:var(--gold-d);font-weight:600}
.pill.ok{background:var(--ok-t);color:var(--ok)}
.pill.mute{background:#F1EEE8;color:var(--muted)}
.btn{display:block;width:100%;border:0;border-radius:15px;padding:15px;font-size:15px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:.15s}
.btn:active{opacity:.85;transform:scale(.995)}
.btn.primary{background:var(--ink);color:#fff}
.btn.gold{background:var(--gold);color:#241703}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:9px 16px;font-size:12.5px;width:auto;border-radius:11px}
.btn.dng{background:#B4483C;color:#fff}

/* 二次确认 / 异常兜底弹层 */
.sheet{position:absolute;inset:0;z-index:70;display:none;align-items:flex-end;
  background:rgba(10,9,8,.42)}
.sheet.show{display:flex}
.sh-card{background:var(--paper);width:100%;border-radius:22px 22px 0 0;padding:26px 20px 20px;
  box-shadow:0 -12px 40px rgba(0,0,0,.18);animation:shUp .2s ease-out}
@keyframes shUp{from{transform:translateY(30px);opacity:.5}to{transform:translateY(0);opacity:1}}
.sh-t{font-size:16.5px;font-weight:700;color:var(--ink);text-align:center;letter-spacing:.01em}
.sh-d{font-size:12.5px;color:var(--ink2);line-height:1.8;margin-top:11px;text-align:center}
.sh-act{display:flex;gap:10px;margin-top:22px}
.sh-act .btn{flex:1}

/* 首页 */
.hero{position:relative;height:312px;overflow:hidden;background:#1b1a18}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,9,8,.45) 0%,rgba(10,9,8,0) 38%,rgba(10,9,8,.72) 100%)}
.hero .ht{position:absolute;left:22px;right:22px;bottom:26px;color:#fff}
.hero .ht .k{font-size:10.5px;letter-spacing:.28em;opacity:.75;margin-bottom:9px}
.hero .ht .h1{font-size:25px;font-weight:700;line-height:1.35;letter-spacing:.01em}
.hero .ht .h2{font-size:12px;opacity:.82;margin-top:9px;letter-spacing:.03em}
.searchbar{position:absolute;left:18px;right:18px;top:58px;height:44px;border-radius:14px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(10px);display:flex;align-items:center;
  gap:9px;padding:0 15px;font-size:13px;color:var(--muted);cursor:pointer}
.chips{display:flex;gap:9px;overflow-x:auto;padding:16px 18px 4px}
.chips::-webkit-scrollbar{height:0}
.chip{flex:0 0 auto;padding:9px 17px;border-radius:22px;background:var(--card);border:1px solid var(--line);
  font-size:12.5px;color:var(--ink2);cursor:pointer;transition:.15s}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.pz-empty{padding:56px 24px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:0 18px}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.18s}
.wcard:active{transform:scale(.985)}
.wcard img{width:100%;height:186px;object-fit:cover;display:block}
.wcard .wi{padding:10px 11px 12px}
.wcard .wt{font-size:13px;font-weight:600;line-height:1.3}
.wcard .wp{font-size:13px;font-weight:700;color:var(--gold-d);margin-top:5px}
.wcard .wb{font-size:10.5px;color:var(--muted);margin-top:2px}

/* 摄影师列表 */
.plist{padding:0 18px}
.prow{display:flex;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:13px;margin-bottom:11px;cursor:pointer;transition:.15s}
.prow:active{transform:scale(.99)}
.av{width:62px;height:62px;border-radius:15px;object-fit:cover;flex:0 0 auto}
.prow .info{flex:1;min-width:0}
.prow .nm{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.prow .meta{font-size:11.5px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .row2{display:flex;align-items:baseline;gap:6px;margin-top:7px}
.prow .rate{font-size:13px;font-weight:700;color:var(--gold-d)}
.prow .cnt{font-size:10.5px;color:var(--muted)}
.prow .price{margin-left:auto;font-size:14px;font-weight:700;color:var(--ink)}
.prow .price i{font-size:10px;font-style:normal;color:var(--muted);font-weight:400}

/* 摄影师主页 */
.dcover{position:relative;height:280px}
.dcover img{width:100%;height:100%;object-fit:cover;display:block}
.dcover .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,9,8,.5),rgba(10,9,8,0) 45%,rgba(10,9,8,.55))}
.dcover .back{position:absolute;top:58px;left:16px;width:34px;height:34px;border-radius:50%;
  background:rgba(20,20,20,.42);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer}
.dhead{margin:-42px 18px 0;position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:16px;display:flex;gap:13px}
.dhead .av{width:66px;height:66px;border-radius:18px;margin-top:-38px;border:3px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.dhead .nm{font-size:17px;font-weight:700;display:flex;align-items:center;gap:7px}
.dhead .st{font-size:11.5px;color:var(--muted);margin-top:5px}
.dstats{display:flex;margin:14px 18px 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 0}
.dstats div{flex:1;text-align:center;position:relative}
.dstats div+div::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:1px;background:var(--line)}
.dstats b{display:block;font-size:16px;font-weight:700}
.dstats span{font-size:10.5px;color:var(--muted)}
.dtabs{display:flex;gap:24px;padding:18px 18px 0;border-bottom:1px solid var(--line);margin-bottom:16px}
.dtab{font-size:13.5px;color:var(--muted);padding-bottom:11px;border-bottom:2px solid transparent;cursor:pointer;transition:.15s}
.dtab.on{color:var(--ink);font-weight:700;border-color:var(--gold)}
.pkg{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:14px;margin:0 18px 11px;cursor:pointer}
.pkg .pi{width:46px;height:46px;border-radius:12px;background:var(--gold-t);color:var(--gold-d);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.pkg .pn{font-size:13.5px;font-weight:600}
.pkg .pd{font-size:11px;color:var(--muted);margin-top:4px}
.pkg .pp{margin-left:auto;font-size:15px;font-weight:700;color:var(--gold-d)}
#dock{position:absolute;left:0;right:0;bottom:78px;z-index:32}
.dock{background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:13px 18px;display:flex;align-items:center;gap:14px}
.dock .dp{font-size:19px;font-weight:700}
.dock .dp i{font-size:11px;font-style:normal;color:var(--muted);font-weight:400}
.dock .btn{width:auto;flex:1;padding:14px}

/* 下单 / 支付 */
.field{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.field:last-child{border-bottom:0}
.field .k{color:var(--muted);width:56px;flex:0 0 auto}
.field .v{flex:1;font-weight:600}
.field .ar{color:var(--muted)}
.warn{background:var(--gold-t);border:1px solid #EADCC4;border-radius:14px;padding:13px 14px;
  margin:0 18px 14px;display:flex;gap:10px;font-size:11.5px;line-height:1.75;color:#7A5B32}
.warn b{color:#5C421F;display:block;font-size:12px;margin-bottom:2px}
.amount{text-align:center;padding:34px 0 26px}
.amount .a{font-size:40px;font-weight:700;letter-spacing:-.02em}
.amount .a i{font-size:20px;font-style:normal;margin-right:3px}
.amount .s{font-size:11.5px;color:var(--muted);margin-top:8px}
.payrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:15px;margin:0 18px 10px;font-size:13.5px;font-weight:600;cursor:pointer}
.payrow .rd{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--line);margin-left:auto;flex:0 0 auto}
.payrow.on .rd{border-color:var(--gold);box-shadow:inset 0 0 0 4px var(--gold)}
.payrow .pi{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px}
.payrow .pz{display:block;font-style:normal;font-size:10.5px;color:var(--muted);margin-top:2px}

/* 订单 */
.otabs{display:flex;padding:14px 18px 0;gap:22px;position:sticky;top:96px;background:var(--paper);z-index:15}
.otab{font-size:13px;color:var(--muted);padding-bottom:10px;border-bottom:2px solid transparent;cursor:pointer}
.otab.on{color:var(--ink);font-weight:700;border-color:var(--gold)}
.olist{padding:14px 18px 0}
.ocard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:11px}
.ocard .ot{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--line)}
.ocard .ob{display:flex;gap:12px;padding:12px 0}
.ocard .ob img{width:66px;height:66px;border-radius:12px;object-fit:cover;flex:0 0 auto}
.ocard .on{font-size:13.5px;font-weight:600}
.ocard .os{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.6}
.ocard .of{display:flex;align-items:center;justify-content:flex-end;gap:9px;padding-top:10px;border-top:1px solid var(--line)}
.ocard .total{font-size:13.5px;font-weight:700;margin-right:auto}

/* 消息 */
.chatrow{display:flex;align-items:center;gap:12px;padding:13px 18px;cursor:pointer}
.chatrow:active{background:#F4F1EB}
.chatrow img{width:48px;height:48px;border-radius:14px;object-fit:cover}
.chatrow .cn{font-size:13.5px;font-weight:600}
.chatrow .cm{font-size:11.5px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.chatrow .ct{margin-left:auto;font-size:10.5px;color:var(--muted);align-self:flex-start;padding-top:2px}
.chatrow .dot{width:7px;height:7px;border-radius:50%;background:var(--bad);position:absolute;margin-left:38px;margin-top:-34px}
.bubbles{padding:14px 18px 20px;display:flex;flex-direction:column;gap:12px}
.bb{max-width:76%;padding:11px 14px;border-radius:16px;font-size:13px;line-height:1.65}
.bb.them{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.bb.me{background:var(--ink);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.bb .tm{font-size:10px;opacity:.55;margin-top:5px}
.inputbar{background:#fff;border-top:1px solid var(--line);
  padding:12px 16px 20px;display:flex;gap:10px;align-items:center}
.inputbar input{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:22px;
  padding:11px 16px;font-size:13px;outline:none;font-family:inherit}
.inputbar button{border:0;background:var(--ink);color:#fff;border-radius:22px;padding:11px 18px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}

/* 我的 */
.mecard{margin:56px 18px 0;display:flex;align-items:center;gap:14px;background:var(--card);
  border:1px solid var(--line);border-radius:20px;padding:17px}
.mecard img{width:60px;height:60px;border-radius:18px;object-fit:cover}
.mecard .mn{font-size:17px;font-weight:700;display:flex;align-items:center;gap:7px}
.mecard .mi{font-size:11px;color:var(--muted);margin-top:5px}
.mestats{display:flex;margin:12px 18px 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 0}
.mestats div{flex:1;text-align:center}
.mestats b{display:block;font-size:16px;font-weight:700}
.mestats span{font-size:10.5px;color:var(--muted)}
.mrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:15px;margin:9px 18px 0;font-size:13.5px;cursor:pointer}
.mrow .mi2{width:32px;height:32px;border-radius:10px;background:var(--gold-t);color:var(--gold-d);
  display:flex;align-items:center;justify-content:center}
.mrow .ar{margin-left:auto;color:var(--line)}

/* 摄影师端 */
.wbhead{margin:56px 18px 0;background:var(--ink);border-radius:22px;padding:20px;color:#fff;position:relative;overflow:hidden}
.wbhead .gh{font-size:11px;color:#9A9CA3;letter-spacing:.04em}
.wbhead .nm{font-size:21px;font-weight:700;margin-top:6px}
.wbhead .sub{font-size:11.5px;color:#9A9CA3;margin-top:8px}
.wbhead .badge{position:absolute;right:18px;top:20px;font-size:10px;background:rgba(192,139,78,.18);
  color:#DDB477;border:1px solid rgba(192,139,78,.35);padding:4px 9px;border-radius:20px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:12px 18px 0}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px}
.dcard b{display:block;font-size:21px;font-weight:700;letter-spacing:-.01em}
.dcard span{font-size:11px;color:var(--muted);display:block;margin-top:4px}
.dcard .trend{font-size:10px;color:var(--ok);margin-top:7px;font-weight:600}
.todo{margin:12px 18px 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}
.todo .tt{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.todo .tn{font-size:14.5px;font-weight:700;margin-top:9px}
.todo .tm2{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.6}
.todo .acts{display:flex;gap:9px;margin-top:13px}
.todo .acts .btn{flex:1;padding:11px;font-size:12.5px}
.pgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:0 18px}
.pitem{position:relative;border-radius:11px;overflow:hidden;cursor:pointer}
.pitem img{width:100%;height:112px;object-fit:cover;display:block}
.pitem .pv{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.72));
  color:#fff;font-size:9.5px;padding:12px 7px 5px}
.bal{margin:56px 18px 0;background:linear-gradient(135deg,#22232A,#15161A);border-radius:22px;
  padding:22px;color:#fff;position:relative;overflow:hidden}
.bal::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;
  border-radius:50%;background:rgba(192,139,78,.14)}
.bal .lb{font-size:11px;color:#9A9CA3;letter-spacing:.06em}
.bal .v{font-size:34px;font-weight:700;margin:9px 0 0;letter-spacing:-.02em}
.bal .v i{font-size:17px;font-style:normal;margin-right:4px;color:#DDB477}
.bal .b3{display:flex;margin-top:20px;gap:0}
.bal .b3 div{flex:1}
.bal .b3 b{display:block;font-size:14px;font-weight:600}
.bal .b3 span{font-size:10px;color:#8A8C93}
.bal .wd{position:absolute;right:20px;bottom:22px;background:var(--gold);color:#241703;border:0;
  border-radius:12px;padding:10px 18px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}

    + '<span style="font-size:12.5px;color:var(--muted);padding-bottom:6px">已过审 8</span>'
    + '<span style="font-size:12.5px;color:var(--muted);padding-bottom:6px">审核中 1</span></div>'
    + '<div class="pgrid">' + g + '</div>'
    + '<div style="margin:16px 18px 0;font-size:11px;color:var(--muted);line-height:1.8">'
    + '作品经平台审核后对外展示，未过审作品不出现在用户端信息流。</div>';
}

function vPincome(){
  var h = '';
  for (var i = 0; i < INCOME.length; i++){
    var r = INCOME[i];
    var neg = r.v.indexOf('-') === 0;
    h += '<div class="incrow"><div class="ii">' + ic(neg ? 'wallet' : 'check', 17) + '</div>'
      + '<div><div class="in">' + r.n + '</div><div class="id">' + r.d + '</div></div>'
      + '<div class="iv' + (neg ? ' neg' : '') + '">' + r.v + '</div></div>';
  }
  return ''
    + '<div class="bal"><div class="lb">可提现余额</div>'
    + '<div class="v"><i>¥</i>12,480.50</div>'
    + '<div class="b3"><div><b>¥8,420</b><span>本月收入</span></div>'
    + '<div><b>¥1,286</b><span>待结算</span></div>'
    + '<div><b>¥3,000</b><span>已提现</span></div></div>'
    + '<button class="wd" onclick="toast(\'提现申请已提交，预计 1 个工作日到账\')">提现</button></div>'
    + '<h2 class="sec">收支明细<span>近 30 天</span></h2>'
    + '<div class="card" style="padding:4px 15px">' + h + '</div>'
    + '<div style="margin:6px 18px 0;font-size:11px;color:var(--muted);line-height:1.8">'
    + '每笔订单结算时平台扣除 10% 撮合服务费，明细可在对应订单中查看。</div>';
}

function vPdash(){
  var max = 100;
  var bars = '';
  for (var i = 0; i < WEEK.length; i++){
    var hp = Math.round(WEEK[i] / max * 100);
    bars += '<div class="col"><div class="bar' + (i === 5 ? '' : ' dim') + '" style="height:' + hp + '%"></div>'
      + '<div class="cl">' + WDAY[i] + '</div></div>';
  }
  return ''
    + '<div class="appbar solid"><div class="t">数据看板</div><div class="right">近 7 天</div></div>'
    + '<div class="dgrid" style="padding-top:2px">'
    + '<div class="dcard"><b>2,310</b><span>曝光量</span></div>'
    + '<div class="dcard"><b>186</b><span>咨询量</span></div>'
    + '<div class="dcard"><b>34</b><span>下单量</span></div>'
    + '<div class="dcard"><b>4.9</b><span>评价分</span></div>'
    + '</div>'
    + '<div class="card" style="margin-top:12px"><div style="font-size:12px;color:var(--muted);margin-bottom:4px">每日咨询量</div>'
    + '<div class="chart">' + bars + '</div></div>'
    + '<div class="card"><div style="font-size:12px;color:var(--muted);margin-bottom:14px">转化漏斗</div>'
    + '<div class="funnel">'
    + '<div class="fstep"><span class="fk">曝光</span><div class="fb"><i style="width:100%"></i></div><span class="fv">2,310</span></div>'
    + '<div class="fstep"><span class="fk">咨询</span><div class="fb"><i style="width:38%"></i></div><span class="fv">186</span></div>'
    + '<div class="fstep" style="margin-bottom:0"><span class="fk">下单</span><div class="fb"><i style="width:17%"></i></div><span class="fv">34</span></div>'
    + '</div>'
    + '<div style="font-size:11px;color:var(--muted);margin-top:14px;line-height:1.8">'
    + '曝光→咨询 8.1%，咨询→下单 18.3%。咨询转化偏低，建议优化套餐详情页首图与报价说明。</div>'
    + '</div>';
}

go('home');
</script>
